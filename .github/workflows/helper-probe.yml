# Temporary: finds where the engine accepts its macOS clipboard helper. Removed after one run.
name: Helper probe
on:
  push:
    branches: [claude/project-thread-cne2uz]
    paths: ['.github/workflows/helper-probe.yml']
jobs:
  probe:
    runs-on: macos-15
    steps:
      - run: |
          set +e
          curl -sSL -o e.tgz https://github.com/vercel-labs/agent-desktop/releases/download/v1.0.2/agent-desktop-v1.0.2-aarch64-apple-darwin.tar.gz
          mkdir -p a && tar -xzf e.tgz -C a
          try() { echo "== $1"; ls -le "$2"; AGENT_DESKTOP_MACOS_HELPER_PATH="$2/agent-desktop-macos-helper" "$2/agent-desktop" clipboard-set "probe $1"; echo; "$2/agent-desktop" clipboard-get; echo; }
          try plain "$PWD/a"
          umask 022
          ls -ld /Applications; id
          mkdir -p /Applications/T.app/Contents/MacOS && cp a/* /Applications/T.app/Contents/MacOS/
          try applications /Applications/T.app/Contents/MacOS
          codesign --force -s - /Applications/T.app/Contents/MacOS/agent-desktop-macos-helper
          try applications-adhoc /Applications/T.app/Contents/MacOS
          xattr -w com.apple.quarantine "0081;00000000;Safari;" /Applications/T.app/Contents/MacOS/agent-desktop-macos-helper
          try applications-quarantine /Applications/T.app/Contents/MacOS
          S="$HOME/Library/Application Support/ands-probe"; mkdir -p "$S" && chmod 700 "$S" && cp a/* "$S/"
          try appsupport "$S"
          sudo mkdir -p /Applications/R.app/Contents/MacOS && sudo cp a/* /Applications/R.app/Contents/MacOS/
          try root-owned /Applications/R.app/Contents/MacOS
          D=$(mktemp -d); cp a/agent-desktop-macos-helper "$D/"; chmod 700 "$D"
          echo "== split"; AGENT_DESKTOP_MACOS_HELPER_PATH="$D/agent-desktop-macos-helper" /Applications/T.app/Contents/MacOS/agent-desktop clipboard-set "split"; echo
          exit 0
