# Builds the ands desktop app for macOS (Apple silicon + Intel), Windows and Linux, and releases it
# here, where ands.sh/download and the app's updater point. The app's code is private
# (barzaken/ands-cloud, apps/desktop); this public workflow checks it out with ANDS_CLOUD_TOKEN
# (a fine-grained token with Contents: read on ands-cloud) and builds it on top of the public
# @ands/core, so builds stay free. ands-cloud starts it with a repository_dispatch:
# {ref: <ands-cloud commit>, release: true on its main}. Unsigned until the signing secrets exist;
# then the same job signs (and notarizes on macOS). See docs/RELEASING.md.
name: Desktop app
on:
  repository_dispatch:
    types: [desktop]
  push:
    branches: [main]
    tags: ['v*']
    paths: ['packages/core/**', 'scripts/build-npm.mjs', '.github/workflows/desktop.yml']
  workflow_dispatch:
    inputs:
      cloud_ref: { description: 'ands-cloud commit or branch to build', type: string, default: 'main' }
      release: { description: 'Release tag to create, like v0.1.0 (empty = just build)', type: string, default: '' }

env:
  CLOUD_REF: ${{ github.event.client_payload.ref || inputs.cloud_ref || 'main' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, target: aarch64-apple-darwin }
          - { os: macos-15-intel, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
    runs-on: ${{ matrix.os }}
    env:
      HAS_APPLE: ${{ secrets.APPLE_CERTIFICATE != '' }}
      HAS_AZURE: ${{ secrets.AZURE_CLIENT_ID != '' }}
      HAS_UPDATER: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { repository: barzaken/ands-cloud, ref: '${{ env.CLOUD_REF }}', token: '${{ secrets.ANDS_CLOUD_TOKEN }}', path: .cloud, sparse-checkout: apps/desktop }
      - uses: actions/setup-node@v4
        with: { node-version: '22.18', cache: npm }
      - name: Rust toolchain
        run: rustup toolchain install 1.90 --profile minimal --target ${{ matrix.target }} && rustup default 1.90
      - name: Linux system libraries for the window
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck && npm test
      # The private app goes where it sits in ands-cloud's layout, next to the public packages/core.
      - name: The app from ands-cloud
        shell: bash
        run: |
          mkdir -p apps && mv .cloud/apps/desktop apps/desktop && rm -rf .cloud
          npm --prefix apps/desktop install --no-audit --no-fund
          npx tsc -p apps/desktop/tsconfig.json --noEmit
          node --test apps/desktop/test/*.test.ts
      - name: Window and engine
        working-directory: apps/desktop
        run: npm run ui && node scripts/fetch-engine.mjs --target ${{ matrix.target }}
      - name: Mac signing secrets (only when they exist)
        if: runner.os == 'macOS' && env.HAS_APPLE == 'true'
        shell: bash
        run: |
          {
            echo "APPLE_CERTIFICATE=${{ secrets.APPLE_CERTIFICATE }}"
            echo "APPLE_CERTIFICATE_PASSWORD=${{ secrets.APPLE_CERTIFICATE_PASSWORD }}"
            echo "APPLE_SIGNING_IDENTITY=${{ secrets.APPLE_SIGNING_IDENTITY }}"
            echo "APPLE_ID=${{ secrets.APPLE_ID }}"
            echo "APPLE_PASSWORD=${{ secrets.APPLE_PASSWORD }}"
            echo "APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID }}"
          } >> "$GITHUB_ENV"
      # Without a Developer ID, sign ad hoc: an unsigned Apple Silicon app is reported as "damaged",
      # while an ad-hoc signed one gets the normal "Open Anyway" in Privacy & Security.
      - name: Mac ad-hoc signing (until the Developer ID exists)
        if: runner.os == 'macOS' && env.HAS_APPLE != 'true'
        shell: bash
        run: echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
      # The updater's own signature on each new version (the app checks it before installing), once the key exists.
      - name: Updater key (only when it exists)
        if: env.HAS_UPDATER == 'true'
        shell: bash
        run: |
          echo "TAURI_SIGNING_PRIVATE_KEY=${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" >> "$GITHUB_ENV"
          echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}" >> "$GITHUB_ENV"
          echo '{"bundle":{"createUpdaterArtifacts":true}}' > apps/desktop/updater.conf.json
      - name: Build
        working-directory: apps/desktop
        shell: bash
        run: npx tauri build --target ${{ matrix.target }} $([ -f updater.conf.json ] && echo --config updater.conf.json)
      - name: Check the Mac app's signature
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app=$(find apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos -maxdepth 1 -name '*.app' | head -1)
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv "$app" 2>&1 | grep -E 'Signature|Identifier'
      # Windows: signs the installers with Azure Trusted Signing once its secrets exist.
      - name: Sign Windows installers
        if: runner.os == 'Windows' && env.HAS_AZURE == 'true'
        uses: azure/trusted-signing-action@v0.5.1
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CERT_PROFILE }}
          files-folder: apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle
          files-folder-filter: exe,msi
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      # Signing changed the installer, so its updater signature is made again.
      - name: Updater signature after Windows signing
        if: runner.os == 'Windows' && env.HAS_AZURE == 'true' && env.HAS_UPDATER == 'true'
        working-directory: apps/desktop
        shell: bash
        run: for f in src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe; do rm -f "$f.sig"; npx tauri signer sign "$f"; done
      - uses: actions/upload-artifact@v4
        with:
          name: ands-${{ matrix.target }}
          path: |
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.sig
          if-no-files-found: error

  # Releases the version in tauri.conf.json to GitHub Releases (where ands.sh/download points):
  # on a push to main when that version has no release yet, on a v* tag, or by hand with a tag name.
  release:
    # A dispatch from ands-cloud's main, a push to main here (core changed), a v* tag, or by hand with a tag.
    if: github.event.client_payload.release == true || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) || (github.event_name == 'workflow_dispatch' && inputs.release != '')
    needs: build
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
        with: { repository: barzaken/ands-cloud, ref: '${{ env.CLOUD_REF }}', token: '${{ secrets.ANDS_CLOUD_TOKEN }}', sparse-checkout: apps/desktop/src-tauri/tauri.conf.json, sparse-checkout-cone-mode: false }
      - env: { GH_TOKEN: '${{ github.token }}', GH_REPO: '${{ github.repository }}', INPUT_TAG: '${{ inputs.release }}', REF: '${{ github.ref_name }}', REF_TYPE: '${{ github.ref_type }}' }
        run: |
          if [ "$REF_TYPE" = tag ]; then TAG="$REF"
          elif [ -n "$INPUT_TAG" ]; then TAG="$INPUT_TAG"
          else TAG="v$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")"; fi
          if gh release view "$TAG" >/dev/null 2>&1; then echo "$TAG is already released"; exit 0; fi
          gh run download ${{ github.run_id }} -D out
          # Fixed names, so ands.sh/download can link to releases/latest/download/<name>.
          mkdir rel
          one() { f=$(find "out/ands-$1" -name "$2" | head -1); if [ -n "$f" ]; then cp "$f" "rel/$3"; fi; }
          one aarch64-apple-darwin '*.dmg' ands-mac-apple-silicon.dmg
          one x86_64-apple-darwin '*.dmg' ands-mac-intel.dmg
          one x86_64-pc-windows-msvc '*-setup.exe' ands-windows-setup.exe
          one x86_64-pc-windows-msvc '*.msi' ands-windows.msi
          one x86_64-unknown-linux-gnu '*.AppImage' ands-linux.AppImage
          one x86_64-unknown-linux-gnu '*.deb' ands-linux.deb
          test "$(ls rel | wc -l)" -eq 6
          # The updater's files and latest.json (what the app reads at releases/latest/download/latest.json),
          # only when the builds were signed with the updater key.
          if find out -name '*.sig' | grep -q .; then
            one aarch64-apple-darwin '*.app.tar.gz' ands-mac-apple-silicon.app.tar.gz
            one aarch64-apple-darwin '*.app.tar.gz.sig' ands-mac-apple-silicon.app.tar.gz.sig
            one x86_64-apple-darwin '*.app.tar.gz' ands-mac-intel.app.tar.gz
            one x86_64-apple-darwin '*.app.tar.gz.sig' ands-mac-intel.app.tar.gz.sig
            one x86_64-pc-windows-msvc '*-setup.exe.sig' ands-windows-setup.exe.sig
            one x86_64-unknown-linux-gnu '*.AppImage.sig' ands-linux.AppImage.sig
            VERSION="${TAG#v}" TAG="$TAG" REPO="$GH_REPO" node -e '
              const fs = require("fs"); const at = (n) => `https://github.com/${process.env.REPO}/releases/download/${process.env.TAG}/${n}`;
              const p = {}; const add = (k, n) => { if (fs.existsSync(`rel/${n}.sig`)) p[k] = { signature: fs.readFileSync(`rel/${n}.sig`, "utf8").trim(), url: at(n) }; };
              add("darwin-aarch64", "ands-mac-apple-silicon.app.tar.gz"); add("darwin-x86_64", "ands-mac-intel.app.tar.gz");
              add("windows-x86_64", "ands-windows-setup.exe"); add("linux-x86_64", "ands-linux.AppImage");
              fs.writeFileSync("rel/latest.json", JSON.stringify({ version: process.env.VERSION, pub_date: new Date().toISOString(), platforms: p }, null, 2));'
          fi
          ls -l rel
          gh release create "$TAG" --target "${{ github.sha }}" --title "ands $TAG" --generate-notes rel/*
